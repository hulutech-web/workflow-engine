basePath: /api
definitions:
  req.AccountLoginReq:
    properties:
      password:
        maxLength: 32
        minLength: 6
        type: string
      tenantId:
        type: integer
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - password
    - tenantId
    - username
    type: object
  req.AccountRegisterReq:
    properties:
      confirm:
        type: string
      email:
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
      phone:
        type: string
      tenantId:
        type: integer
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - confirm
    - email
    - password
    - phone
    - tenantId
    - username
    type: object
  req.FileCateAddReq:
    properties:
      name:
        description: 分类名称
        maxLength: 30
        minLength: 1
        type: string
      pid:
        description: 父级ID
        minimum: 0
        type: integer
      type:
        description: '分类类型: [10=图片,20=视频]'
        enum:
        - 10
        - 20
        - 30
        type: integer
    required:
    - name
    - type
    type: object
  req.FileCateListReq:
    properties:
      keyword:
        description: 分类名称
        type: string
      type:
        description: '分类类型: [10=图片,20=视频]'
        enum:
        - 10
        - 20
        - 30
        type: integer
    type: object
  req.FileCateRenameReq:
    properties:
      id:
        description: 主键
        type: integer
      keyword:
        description: 分类名称
        maxLength: 30
        minLength: 1
        type: string
    required:
    - id
    - keyword
    type: object
  req.FileListReq:
    properties:
      cid:
        description: 类目ID
        type: integer
      keyword:
        description: 文件名称
        type: string
      type:
        description: '文件类型: [10=图片, 20=视频]'
        enum:
        - 10
        - 20
        type: integer
    type: object
  req.FileMoveReq:
    properties:
      cid:
        description: 类目ID
        type: integer
      ids:
        description: 主键
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  req.FileRenameReq:
    properties:
      id:
        description: 主键
        type: integer
      keyword:
        description: 文件名称
        maxLength: 30
        minLength: 1
        type: string
    required:
    - id
    - keyword
    type: object
  req.IdListReq:
    properties:
      ids:
        description: 主键ID列表
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  req.IdReq:
    properties:
      id:
        description: 主键ID
        type: integer
    required:
    - id
    type: object
  req.MenuAddReq:
    properties:
      badge:
        maxLength: 255
        type: string
      button:
        items:
          $ref: '#/definitions/req.MenuButton'
        type: array
      cacheable:
        type: boolean
      component:
        maxLength: 255
        type: string
      icon:
        maxLength: 255
        type: string
      menu_type:
        enum:
        - menu
        - action
        type: string
      name:
        maxLength: 125
        type: string
      path:
        maxLength: 255
        type: string
      permission:
        maxLength: 255
        type: string
      pid:
        type: integer
      render_menu:
        type: boolean
      sort:
        type: integer
      target:
        maxLength: 255
        type: string
      title:
        maxLength: 125
        type: string
    required:
    - component
    - menu_type
    - name
    - path
    - pid
    - title
    type: object
  req.MenuButton:
    properties:
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
      title:
        type: string
    type: object
  req.MenuEditReq:
    properties:
      badge:
        maxLength: 255
        type: string
      button:
        items:
          $ref: '#/definitions/req.MenuButton'
        type: array
      cacheable:
        type: boolean
      component:
        maxLength: 255
        type: string
      icon:
        maxLength: 255
        type: string
      id:
        type: integer
      menu_type:
        enum:
        - menu
        - action
        type: string
      name:
        maxLength: 125
        type: string
      path:
        maxLength: 255
        type: string
      permission:
        maxLength: 255
        type: string
      pid:
        type: integer
      render_menu:
        type: boolean
      sort:
        type: integer
      target:
        maxLength: 255
        type: string
      title:
        maxLength: 125
        type: string
    required:
    - component
    - id
    - menu_type
    - name
    - path
    - pid
    - title
    type: object
  req.PageReq:
    properties:
      pageNo:
        description: 页码
        minimum: 1
        type: integer
      pageSize:
        description: 每页大小
        maximum: 60
        type: integer
    type: object
  req.RoleAddReq:
    properties:
      is_admin:
        enum:
        - 0
        - 1
        type: integer
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      menus:
        items:
          type: integer
        type: array
      name:
        maxLength: 125
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  req.RoleEditReq:
    properties:
      id:
        type: integer
      is_admin:
        enum:
        - 0
        - 1
        type: integer
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      menus:
        items:
          type: integer
        type: array
      name:
        maxLength: 125
        type: string
      remark:
        maxLength: 255
        type: string
      sort:
        type: integer
    required:
    - id
    - name
    type: object
  req.TenantAddReq:
    properties:
      address:
        maxLength: 255
        type: string
      description:
        maxLength: 255
        type: string
      domain:
        type: string
      email:
        type: string
      expired_at:
        minimum: 0
        type: integer
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      logo:
        type: string
      menus:
        items:
          type: integer
        type: array
      name:
        maxLength: 125
        type: string
      phone:
        type: string
    required:
    - address
    - domain
    - email
    - name
    - phone
    type: object
  req.TenantEditReq:
    properties:
      address:
        maxLength: 255
        type: string
      description:
        maxLength: 255
        type: string
      domain:
        type: string
      email:
        type: string
      expired_at:
        minimum: 0
        type: integer
      id:
        type: integer
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      logo:
        type: string
      menus:
        items:
          type: integer
        type: array
      name:
        maxLength: 125
        type: string
      phone:
        type: string
    required:
    - address
    - domain
    - email
    - id
    - name
    - phone
    type: object
  req.UserAddReq:
    properties:
      avatar:
        type: string
      email:
        type: string
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      is_multipoint:
        enum:
        - 0
        - 1
        type: integer
      nickname:
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
      phone:
        type: string
      role_id:
        minimum: 0
        type: integer
      tenant_id:
        minimum: 0
        type: integer
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - password
    - phone
    - username
    type: object
  req.UserEditReq:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        minimum: 1
        type: integer
      is_disable:
        enum:
        - 0
        - 1
        type: integer
      is_multipoint:
        enum:
        - 0
        - 1
        type: integer
      nickname:
        type: string
      phone:
        type: string
      role_id:
        minimum: 0
        type: integer
      tenant_id:
        minimum: 0
        type: integer
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - id
    - phone
    - username
    type: object
  req.UserQueryReq:
    properties:
      email:
        type: string
      is_disable:
        default: -1
        enum:
        - 0
        - 1
        - -1
        type: integer
      phone:
        type: string
      role_id:
        minimum: 0
        type: integer
      tenant_id:
        minimum: 0
        type: integer
      username:
        type: string
    type: object
  req.UserUpdateReq:
    properties:
      avatar:
        type: string
      confirm_password:
        type: string
      id:
        minimum: 1
        type: integer
      password:
        maxLength: 32
        minLength: 6
        type: string
    required:
    - id
    type: object
  resp.AccountLoginResp:
    properties:
      token:
        type: string
      userInfo:
        $ref: '#/definitions/resp.UserResp'
    type: object
  resp.FileResp:
    properties:
      cid:
        type: integer
      ext:
        type: string
      id:
        type: integer
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      tenant_id:
        type: integer
      type:
        type: string
      uri:
        type: string
      user_id:
        type: integer
    type: object
  resp.MenuButton:
    properties:
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
      title:
        type: string
    type: object
  resp.MenuResp:
    properties:
      badge:
        type: string
      button:
        items:
          $ref: '#/definitions/resp.MenuButton'
        type: array
      cacheable:
        type: boolean
      children:
        items:
          $ref: '#/definitions/resp.MenuResp'
        type: array
      component:
        type: string
      icon:
        type: string
      id:
        type: integer
      menu_type:
        type: string
      name:
        type: string
      path:
        type: string
      permission:
        type: string
      pid:
        type: integer
      render_menu:
        type: boolean
      sort:
        type: integer
      target:
        type: string
      title:
        type: string
    type: object
  resp.RoleResp:
    properties:
      created_at:
        $ref: '#/definitions/types.DateTime'
      id:
        description: 主键
        type: integer
      is_disable:
        description: '是否禁用: [0=否, 1=是]'
        type: integer
      member:
        description: 成员数量
        type: integer
      menus:
        description: 关联菜单
        items:
          type: integer
        type: array
      name:
        description: 角色名称
        type: string
      remark:
        description: 角色备注
        type: string
      sort:
        description: 角色排序
        type: integer
      updated_at:
        $ref: '#/definitions/types.DateTime'
    type: object
  resp.RoleSimpleResp:
    properties:
      created_at:
        $ref: '#/definitions/types.DateTime'
      id:
        description: 主键
        type: integer
      name:
        description: 角色名称
        type: string
      updated_at:
        $ref: '#/definitions/types.DateTime'
    type: object
  resp.SelectOption:
    properties:
      disabled:
        type: boolean
      label:
        type: string
      value: {}
    type: object
  resp.TenantResp:
    properties:
      address:
        type: string
      created_at:
        $ref: '#/definitions/types.DateTime'
      description:
        type: string
      domain:
        type: string
      email:
        type: string
      expired_at:
        type: integer
      id:
        type: integer
      is_disable:
        type: integer
      logo:
        type: string
      menus:
        items:
          type: integer
        type: array
      name:
        type: string
      phone:
        type: string
      updated_at:
        $ref: '#/definitions/types.DateTime'
    type: object
  resp.UserResp:
    properties:
      avatar:
        type: string
      created_at:
        $ref: '#/definitions/types.DateTime'
      email:
        type: string
      id:
        type: integer
      is_disable:
        type: integer
      is_multipoint:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      role:
        properties:
          id:
            type: integer
          is_admin:
            type: integer
          name:
            type: string
        type: object
      tenant:
        properties:
          id:
            type: integer
          name:
            type: string
        type: object
      updated_at:
        $ref: '#/definitions/types.DateTime'
      username:
        type: string
    type: object
  resp.UserSelfResp:
    properties:
      permissions:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/resp.UserResp'
    type: object
  response.PageResp:
    properties:
      count:
        description: 总数
        type: integer
      lists:
        description: 数据
      pageNo:
        description: 页No
        type: integer
      pageSize:
        description: 每页Size
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  types.DateTime:
    properties:
      time.Time:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 工作流引擎接口文档
  title: Workflow Engine API
  version: "1.0"
paths:
  /account/login:
    post:
      consumes:
      - application/json
      operationId: Login
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.AccountLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.AccountLoginResp'
              type: object
      summary: 用户登录
      tags:
      - Account 账户管理
  /account/logout:
    get:
      operationId: Logout
      parameters:
      - description: 访问令牌
        in: header
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 用户登出
      tags:
      - Account
      - 账户管理
  /account/register:
    post:
      consumes:
      - application/json
      operationId: Register
      parameters:
      - description: 注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.AccountRegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.AccountLoginResp'
              type: object
      summary: 用户注册
      tags:
      - Account
      - 账户管理
  /account/tenant:
    get:
      operationId: Tenant
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/resp.SelectOption'
                  type: array
              type: object
      summary: 租户列表
      tags:
      - Account
      - 账户管理
  /auth/menu/add:
    post:
      description: 添加菜单
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 菜单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.MenuAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 添加菜单
      tags:
      - 菜单权限
  /auth/menu/delete:
    post:
      description: 删除菜单
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 菜单ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.IdReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除菜单
      tags:
      - 菜单权限
  /auth/menu/detail/{id}:
    get:
      description: 获取菜单详情
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 菜单ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/resp.MenuResp'
      summary: 获取菜单详情
      tags:
      - 菜单权限
  /auth/menu/edit:
    post:
      description: 编辑菜单
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 菜单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.MenuEditReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 编辑菜单
      tags:
      - 菜单权限
  /auth/menu/list:
    get:
      description: 获取菜单列表
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            items:
              $ref: '#/definitions/resp.MenuResp'
            type: array
      summary: 获取菜单列表
      tags:
      - 菜单权限
  /auth/menu/route:
    get:
      description: 获取当前用户的菜单权限
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/resp.MenuResp'
      summary: 获取当前用户的菜单权限
      tags:
      - 菜单权限
  /auth/role/add:
    post:
      description: 添加角色
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.RoleAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 添加角色
      tags:
      - 角色管理
  /auth/role/all:
    get:
      description: 获取所有角色
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.PageResp'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/resp.RoleSimpleResp'
                  type: array
              type: object
      summary: 获取所有角色
      tags:
      - 角色管理
  /auth/role/change:
    post:
      description: 角色状态修改
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 角色ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.IdReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 角色状态修改
      tags:
      - 角色管理
  /auth/role/delete:
    post:
      description: 删除角色
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 角色ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.IdReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除角色
      tags:
      - 角色管理
  /auth/role/detail/{id}:
    get:
      description: 获取角色详情
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 角色ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.IdReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/resp.RoleResp'
      summary: 获取角色详情
      tags:
      - 角色管理
  /auth/role/edit:
    post:
      description: 编辑角色
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/req.RoleEditReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 编辑角色
      tags:
      - 角色管理
  /auth/role/list:
    get:
      description: 获取角色列表
      parameters:
      - description: access_token
        in: header
        name: token
        required: true
        type: string
      - description: 页码
        in: query
        minimum: 1
        name: pageNo
        type: integer
      - description: 每页大小
        in: query
        maximum: 60
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.PageResp'
            - properties:
